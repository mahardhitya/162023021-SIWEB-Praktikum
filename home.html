<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
<nav class="navbar navbar-light bg-white shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="image.png" alt="Logo" width="40" height="40" class="me-2">
      <span class="fw-bold text-uppercase" style="letter-spacing: 2px; color: #000;">
        Foot Locker
      </span>
    </a>
  </div>
</nav>

<div class="p-0 border-bottom">
  <img src="image1.png" class="img-fluid w-100" alt="Banner" style="max-height: 500px; object-fit: cover;">
</div>



<div class="container my-4">
  <div class="row row-cols-1 row-cols-md-3 g-4">
    
    <div class="col">
      <div class="card text-center shadow-sm">
        <div class="card-body">
          <p class="text-muted mb-1">Total Product</p>
          <h3 class="fw-bold mb-0">120</h3> </div>
      </div>
    </div>

    <div class="col">
      <div class="card text-center shadow-sm">
        <div class="card-body">
          <p class="text-muted mb-1">Stock Available</p>
          <h3 class="fw-bold mb-0">85</h3> </div>
      </div>
    </div>

    <div class="col">
      <div class="card text-center shadow-sm">
        <div class="card-body">
          <p class="text-muted mb-1">Categories</p>
          <h3 class="fw-bold mb-0">12</h3> </div>
      </div>
    </div>

  </div>
</div>

<div class="container mt-5">
  <div class="d-flex align-items-center mb-4">
    <h2 class="fw-bold mb-0" style="letter-spacing: 1px;">DAFTAR SEPATU</h2>
  </div>

  <div class="row row-cols-1 row-cols-md-3 g-4">
    <div class="col">
      <div class="card h-100 border-0 shadow-sm">
        <img src="sp1.png" class="card-img-top" alt="Puma" style="object-fit: cover; height: 300px; background-color: #f8f9fa;">
        <div class="card-body">
          <h5 class="card-title fw-bold">Puma Speed Cat</h5>
          <p class="card-text text-danger fw-bold">Rp 1.500.000</p>
          <h6>Stok 15</h6>
          <button class="btn btn-primary btn-sm w-50">Add</button>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="card h-100 border-0 shadow-sm">
        <img src="sp2.png" class="card-img-top" alt="Adidas" style="object-fit: cover; height: 300px; background-color: #f8f9fa;">
        <div class="card-body">
          <h5 class="card-title fw-bold">Adidas Samba</h5>
          <p class="card-text text-danger fw-bold">Rp 2.000.000</p>
          <h6>Stok 10</h6>
          <button class="btn btn-primary btn-sm w-50">Add</button>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="card h-100 border-0 shadow-sm">
        <img src="sp3.png" class="card-img-top" alt="Nike" style="object-fit: cover; height: 300px; background-color: #f8f9fa;">
        <div class="card-body">
          <h5 class="card-title fw-bold">Nike Air Jordan</h5>
          <p class="card-text text-danger fw-bold">Rp 3.500.000</p>
          <h6>Stok 6</h6>
          <button class="btn btn-primary btn-sm w-50">Add</button>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="bg-white border-top py-4 mt-5 shadow-sm">
  <div class="container">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-center">
      
      <div class="d-flex align-items-center mb-3 mb-md-0">
        <img src="image.png" alt="Logo" width="30" height="30" class="me-2">
        <span class="fw-bold text-uppercase" style="letter-spacing: 1px; font-size: 0.9rem;">
         2026 Foot Locker Indonesia
        </span>
    </div>
  </div>
</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
